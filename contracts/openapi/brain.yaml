openapi: 3.1.0
info:
  title: SlideForge Python Brain API
  version: 0.1.0
  description: Python 大脑层基础契约：Prompt 编排与文档文本分块。模型调用、图像分析和 Evals 在后续里程碑接入。
paths:
  /healthz:
    get:
      operationId: getBrainHealth
      responses:
        "200":
          description: Python 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
  /internal/brain/outline-prompt:
    post:
      operationId: buildOutlinePrompt
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief, page_count]
              properties:
                brief: { type: string, minLength: 1 }
                page_count: { type: integer, minimum: 2, maximum: 20 }
                language: { type: string, default: 中文 }
                source_text: { type: string }
      responses:
        "200":
          description: 可直接交给 OpenAI 兼容模型的消息数组
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string }
                        content: { type: string }
  /internal/brain/page-prompt:
    post:
      operationId: buildPagePrompt
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck_title, brief, outline_json, page_index, page_count, page_title, bullets]
              properties:
                deck_title: { type: string }
                brief: { type: string }
                outline_json: { type: string }
                page_index: { type: integer, minimum: 0 }
                page_count: { type: integer, minimum: 1, maximum: 20 }
                page_title: { type: string }
                bullets:
                  type: array
                  items: { type: string }
                visual_spec: { type: string }
                reference_html: { type: string }
      responses:
        "200":
          description: 可直接交给 OpenAI 兼容模型的单页 HTML 消息数组
  /internal/brain/document-chunks:
    post:
      operationId: chunkDocument
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                max_chars: { type: integer, minimum: 1, maximum: 12000 }
                chunk_size: { type: integer, minimum: 500, maximum: 4000 }
                overlap: { type: integer, minimum: 0, maximum: 500 }
      responses:
        "200":
          description: 稳定文档哈希与带字符位置的文本块
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string }
                  chars: { type: integer }
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        start: { type: integer }
                        end: { type: integer }
                        text: { type: string }
  /internal/brain/outline:
    post:
      operationId: generateOutline
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brief, page_count]
              properties:
                brief: { type: string, minLength: 1 }
                page_count: { type: integer, minimum: 2, maximum: 20 }
                language: { type: string, default: 中文 }
                source_text: { type: string }
      responses:
        "200":
          description: 经模型生成并由 Python 校验页数和结构的大纲
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outline" }
  /internal/brain/image-drift:
    post:
      operationId: analyzeImageDrift
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before_base64, after_base64]
              properties:
                before_base64: { type: string }
                after_base64: { type: string }
                threshold: { type: integer, minimum: 0, maximum: 255, default: 16 }
      responses:
        "200":
          description: 确定性图像偏离度指标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageDrift" }
  /internal/brain/evals/run:
    post:
      operationId: runEvals
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cases]
              properties:
                cases:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: object }
      responses:
        "200":
          description: 每个夹具的独立结果和整体通过统计
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      passed: { type: integer }
                      failed: { type: integer }
                  results:
                    type: array
                    items: { type: object }
  /internal/brain/document-extract:
    post:
      operationId: extractDocument
      parameters: [{ $ref: "#/components/parameters/InternalToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_base64]
              properties:
                filename: { type: string }
                content_base64: { type: string }
      responses:
        "200":
          description: DOCX、PDF 或 TXT 提取文本与稳定分块
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  chars: { type: integer }
                  text: { type: string }
                  document_id: { type: string }
components:
  parameters:
    InternalToken:
      name: X-Internal-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    Outline:
      type: object
      required: [title, pages]
      properties:
        title: { type: string }
        pages:
          type: array
          items:
            type: object
            required: [title, bullets]
            properties:
              title: { type: string }
              bullets:
                type: array
                items: { type: string }
        usage:
          type: object
          description: 模型 token 用量，供现有计费上下文结算。
          properties:
            prompt_tokens: { type: number }
            completion_tokens: { type: number }
            total_tokens: { type: number }
    ImageDrift:
      type: object
      required: [resized, width, height, mean_absolute_difference, rms_difference, changed_pixel_ratio, changed_pixels, threshold]
      properties:
        original_size: { type: object }
        resized: { type: boolean }
        width: { type: integer }
        height: { type: integer }
        mean_absolute_difference: { type: number }
        rms_difference: { type: number }
        changed_pixel_ratio: { type: number }
        changed_pixels: { type: integer }
        threshold: { type: integer }
        difference_bbox:
          type: array
          nullable: true
          items: { type: integer }

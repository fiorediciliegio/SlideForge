<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    [data-presenton-slide-shell="true"] { position: relative; width: 1280px; height: 720px; overflow: hidden; background: white; }
    .left { position: absolute; left: 80px; top: 100px; width: 360px; height: 220px; background: #dbeafe; }
    .right { position: absolute; left: 360px; top: 180px; width: 420px; height: 220px; background: #fecaca; }
    .clipped { position: absolute; left: 100px; top: 500px; width: 300px; height: 80px; overflow: hidden; background: #fef3c7; }
    .clipped > span { display: block; width: 500px; white-space: nowrap; font-size: 24px; }
  </style>
</head>
<body>
  <div id="presentation-slides-wrapper" data-presenton-render-status="ready">
    <div data-presenton-slide-shell="true">
      <div class="left">左侧内容</div>
      <div class="right">重叠内容</div>
      <div class="clipped"><span>这是一段应该触发文本溢出的测试文本</span></div>
    </div>
  </div>
</body>
</html>

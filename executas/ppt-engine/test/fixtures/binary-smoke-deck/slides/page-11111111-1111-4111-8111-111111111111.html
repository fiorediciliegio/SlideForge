<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>Binary Browser Smoke</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    .slide { display: flex; width: 1920px; height: 1080px; background: #f8fafc; }
    .panel { display: flex; align-items: center; justify-content: center; width: 960px; height: 1080px; }
    .panel-primary { background: #2563eb; }
    .panel-accent { background: #f97316; }
    h1 { margin: 0; color: #ffffff; font: 700 72px/1.1 Arial, sans-serif; }
  </style>
</head>
<body>
  <main id="binary-smoke-slide" class="slide">
    <section class="panel panel-primary">
      <h1>PPT_ENGINE_BINARY_SMOKE</h1>
    </section>
    <section class="panel panel-accent">
      <svg aria-label="smoke marker" width="300" height="300" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="72" fill="#ffffff" />
        <rect x="72" y="72" width="56" height="56" rx="8" fill="#172033" />
      </svg>
    </section>
  </main>
</body>
</html>

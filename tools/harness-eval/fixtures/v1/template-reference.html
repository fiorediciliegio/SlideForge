<style>
@page{size:1920px 1080px;margin:0}\nhtml,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#F5F2E9}
*{box-sizing:border-box}
:root{
  --page-width:1920px;--page-height:1080px;--margin-x:96px;--margin-y:48px;
  --theme-bg:#F5F2E9;--theme-surface:#F3F0E7;--theme-ink:#1B2620;--theme-muted:#5C665D;
  --theme-accent-primary:#4F5E43;--theme-accent-secondary:#B4914A;--theme-accent-tertiary:#8C9FB2;
  --theme-line:#A3AC9E;--adaptive-title:color-mix(in srgb,var(--theme-ink) 92%,black);
  --font-display:'Bodoni Moda',Georgia,serif;--font-body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --title-serif:104px;--title-bold:100px;--subtitle:25px;--body:20px;--meta:15px;
  --line-thin:1px;--line-medium:2px;
  --spacing-xs:8px;--spacing-sm:16px;--spacing-md:28px;--spacing-lg:44px;
}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--theme-bg);font-family:var(--font-body);color:var(--theme-ink)}
/* L0/L1 shared paper field */
.bg-field{position:absolute;inset:0;z-index:0;background:
  radial-gradient(1100px 780px at 2% 0%,rgba(180,145,74,.09),transparent 70%),
  radial-gradient(880px 760px at 47% 46%,rgba(140,159,178,.10),transparent 70%),
  radial-gradient(950px 760px at 95% 95%,rgba(79,94,67,.10),transparent 72%),
  linear-gradient(168deg,#F8F5EC 0%,#F5F2E9 52%,#EFECE1 100%)}
.bg-field:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(27,38,32,.045) 0 1px,transparent 1px 160px);opacity:.9}
.dot-field{position:absolute;z-index:1;opacity:.38;background-image:radial-gradient(circle,rgba(27,38,32,.45) 1.05px,transparent 1.15px);background-size:15px 15px}
.dot-top{left:1110px;top:0;width:520px;height:145px}.dot-bottom{left:760px;top:820px;width:930px;height:260px;opacity:.24}
.soft-prism{position:absolute;z-index:1;left:710px;top:-260px;width:170px;height:1500px;transform:rotate(17deg);background:linear-gradient(180deg,rgba(140,159,178,.22),rgba(140,159,178,.08) 72%,rgba(140,159,178,0));}
.soft-prism:after{content:"";position:absolute;left:94px;top:0;width:72px;height:1500px;background:rgba(255,255,255,.38)}
.gridline{position:absolute;z-index:2;background:rgba(27,38,32,.06)}
.gl1{left:480px;top:0;width:1px;height:1080px}.gl2{left:960px;top:0;width:1px;height:1080px}.gl3{left:1440px;top:0;width:1px;height:1080px}
.top-rule{position:absolute;left:96px;top:48px;width:1760px;height:1px;z-index:6;background:rgba(27,38,32,.34)}
.left-rule{position:absolute;left:60px;top:40px;width:1px;height:1000px;z-index:6;background:rgba(27,38,32,.26)}
.rail-tick{position:absolute;left:54px;width:13px;height:1px;z-index:7;background:rgba(27,38,32,.42)}
.rail-tick.t1{top:292px}.rail-tick.t2{top:566px}.rail-tick.t3{top:104px}
.page-no{position:absolute;left:28px;top:61px;z-index:15;font-size:14px;font-weight:600;letter-spacing:2px;color:#657066}
.top-meta{position:absolute;left:98px;top:61px;z-index:15;font-size:15px;font-weight:600;letter-spacing:4.2px;color:#4f5b53}
.rail-label{position:absolute;left:44px;top:535px;width:330px;height:24px;z-index:15;transform:rotate(-90deg);transform-origin:left top;font-size:13px;font-weight:600;letter-spacing:5.1px;color:#637067;white-space:nowrap}

.register{position:absolute;right:-7px;top:-60px;width:260px;height:260px;z-index:4;border-radius:50%;border:1px solid rgba(27,38,32,.38)}
.register .r2{position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(27,38,32,.20)}
.register .r3{position:absolute;inset:25px;border-radius:50%;background:conic-gradient(from 210deg,rgba(79,94,67,.20),rgba(79,94,67,0) 24%,rgba(140,159,178,.30) 50%,rgba(140,159,178,.08) 78%,rgba(79,94,67,.20));}

.register .dot{position:absolute;left:48px;top:165px;width:14px;height:14px;border-radius:50%;background:var(--theme-accent-secondary);box-shadow:0 0 0 5px rgba(180,145,74,.13)}
.register .label{position:absolute;left:76px;top:120px;width:132px;text-align:center;font-size:12px;font-weight:600;letter-spacing:3.3px;line-height:2;color:#58645b;z-index:2}
.register .tick{position:absolute;left:-66px;top:145px;width:50px;height:1px;background:rgba(27,38,32,.34)}

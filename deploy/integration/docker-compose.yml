services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slideforge
      POSTGRES_PASSWORD: slideforge-test
      POSTGRES_DB: slideforge
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slideforge -d slideforge"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slideforge-test
      MINIO_ROOT_PASSWORD: slideforge-test-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

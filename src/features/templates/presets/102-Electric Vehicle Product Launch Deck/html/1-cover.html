<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURION E9 — Product Launch Keynote</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* AURION E9 launch deck — shared design system
   Dark cinematic keynote stage. Condensed grotesk display + humanist body.
   Sharp 2px radii, 1px hairlines, amber ember accent, cool steel secondary. */

:root{
  --bg:#0A0B0D;
  --panel:#13161A;
  --panel-2:#181C21;
  --line:#2A3037;
  --line-soft:#1F242A;
  --txt:#F3F2EF;
  --muted:#8C949D;
  --muted-2:#646C75;
  --accent:#FF8A2B;
  --accent-deep:#B9550F;
  --accent-wash:rgba(255,138,43,0.09);
  --cool:#79A4B8;
  --r:2px;
}

body{margin:0;padding:0;overflow:hidden;background:var(--bg);}

.d{font-family:'Barlow Condensed','Arial Narrow',Helvetica,sans-serif;}
.b{font-family:'Barlow','Helvetica Neue',Helvetica,sans-serif;}

.kicker{font-family:'Barlow',Helvetica,sans-serif;font-size:24px;font-weight:600;
  letter-spacing:0.26em;text-transform:uppercase;color:var(--accent);}
.chrome{font-family:'Barlow',Helvetica,sans-serif;font-size:22px;font-weight:500;
  letter-spacing:0.22em;text-transform:uppercase;color:var(--muted-2);}
.title{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;
  color:var(--txt);line-height:1.06;letter-spacing:-0.005em;}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;
  color:var(--accent);line-height:0.92;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.lbl{font-family:'Barlow',Helvetica,sans-serif;font-size:23px;font-weight:600;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--txt);}
.body{font-family:'Barlow',Helvetica,sans-serif;font-size:25px;font-weight:400;
  line-height:1.5;color:var(--muted);text-wrap:pretty;}
.foot{font-family:'Barlow',Helvetica,sans-serif;font-size:22px;font-weight:400;
  line-height:1.4;color:var(--muted-2);}
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover — AURION E9" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#0A0B0D;">

  <img data-object="true" data-object-type="image" src="../assets/hero-car.jpg" alt="AURION E9 at night"
       style="position:absolute;left:520px;top:0px;width:1400px;height:1080px;object-fit:cover;object-position:60% 50%;z-index:5;filter:saturate(0.85) contrast(1.06) brightness(0.92);">

  <div data-object="true" data-object-type="shape"
       style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;z-index:6;background:linear-gradient(97deg,#0A0B0D 0%,#0A0B0D 33%,rgba(10,11,13,0.90) 46%,rgba(10,11,13,0.42) 66%,rgba(10,11,13,0.30) 82%,rgba(10,11,13,0.78) 100%);"></div>

  <div data-object="true" data-object-type="shape"
       style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;z-index:7;background:linear-gradient(180deg,rgba(10,11,13,0.55) 0%,rgba(10,11,13,0) 26%,rgba(10,11,13,0) 62%,rgba(10,11,13,0.82) 100%);"></div>

  <div data-object="true" data-object-type="shape"
       style="position:absolute;left:140px;top:88px;width:52px;height:52px;z-index:10;border:2px solid #FF8A2B;border-radius:2px;background:rgba(255,138,43,0.10);"></div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:212px;top:96px;width:560px;height:40px;z-index:10;">

  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:1400px;top:96px;width:380px;height:40px;z-index:10;text-align:right;">
    <div class="chrome">FY27 Launch Programme</div>
  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:140px;top:352px;width:900px;height:40px;z-index:10;">
    <div class="kicker" style="font-size:26px;">Product Launch Keynote</div>
  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:136px;top:398px;width:1060px;height:284px;z-index:10;">
    <div class="title" style="font-size:250px;font-weight:700;letter-spacing:-0.015em;">AURION<span style="color:#FF8A2B;"> E9</span></div>
  </div>

  <div data-object="true" data-object-type="shape"
       style="position:absolute;left:142px;top:672px;width:132px;height:4px;z-index:10;background:#FF8A2B;"></div>

       style="position:absolute;left:140px;top:712px;width:820px;height:120px;z-index:10;">
    <div class="body" style="font-size:34px;line-height:1.34;color:#D6D4CF;">The mid-size electric SUV for buyers who are done<br>compromising between range, software and price.</div>
  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:140px;top:880px;width:1080px;height:104px;z-index:10;">
    <div style="display:flex;gap:0;">
      <div style="width:300px;border-left:1px solid #2A3037;padding-left:26px;">
        <div class="num" style="font-size:62px;">620<span style="font-size:30px;color:#8C949D;"> km</span></div>
        <div class="chrome" style="font-size:20px;margin-top:8px;">CLTC Range</div>
      </div>
      <div style="width:300px;border-left:1px solid #2A3037;padding-left:26px;">
        <div class="num" style="font-size:62px;">3.8<span style="font-size:30px;color:#8C949D;"> s</span></div>
        <div class="chrome" style="font-size:20px;margin-top:8px;">0–100 km/h</div>
      </div>
      <div style="width:300px;border-left:1px solid #2A3037;padding-left:26px;">
        <div class="num" style="font-size:62px;">18<span style="font-size:30px;color:#8C949D;"> min</span></div>
        <div class="chrome" style="font-size:20px;margin-top:8px;">10 → 80% DC</div>
      </div>
    </div>
  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:140px;top:1006px;width:700px;height:34px;z-index:10;">
    <div class="chrome" style="font-size:21px;">Product Marketing · Confidential Draft</div>
  </div>

  <div data-object="true" data-object-type="textbox"
       style="position:absolute;left:1280px;top:1006px;width:500px;height:34px;z-index:10;text-align:right;">
    <div class="chrome" style="font-size:21px;">Reveal — March 2027 · Shanghai</div>
  </div>

</div>

</html>

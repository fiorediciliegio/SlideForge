<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover — City Food Explorer</title>
<style>
/* City Food Explorer — editorial food-magazine system */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bebas+Neue&family=Caveat:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --tomato: #E63946;
  --tomato-deep: #C1272D;
  --cream: #FBF6EC;
  --cream-warm: #F5EBD8;
  --olive: #6B7A3A;
  --olive-deep: #4E5A28;
  --cobalt: #1F3A93;
  --cobalt-deep: #14265E;
  --yellow: #F5C518;
  --ink: #1A1A1A;
  --paper: #F8F1E1;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow: hidden; }
body { font-family: 'Space Grotesk', sans-serif; color: var(--ink); background: var(--cream); }

.serif { font-family: 'DM Serif Display', serif; }
.display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
.hand { font-family: 'Caveat', cursive; }
.mono { font-family: 'Space Mono', monospace; letter-spacing: -0.02em; }
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#FBF6EC;">

  <!-- Left cream panel -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:1140px; height:1080px; background:#FBF6EC; z-index:1;"></div>

  <!-- Right tomato panel -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1140px; top:0; width:780px; height:1080px; background:#E63946; z-index:1;"></div>

  <!-- Olive header rail -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:1140px; height:70px; background:#6B7A3A; z-index:2;"></div>

  <!-- Top magazine masthead -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:22px; width:900px; z-index:11;">
    <div class="mono" style="color:#FBF6EC; font-size:16px; font-weight:700; letter-spacing:0.28em;">ISSUE Nº 07 · SPRING EDITION · APPETITE MAGAZINE</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1000px; top:22px; width:120px; z-index:11; text-align:right;">
    <div class="mono" style="color:#FBF6EC; font-size:16px; font-weight:700; letter-spacing:0.18em;">$12.00</div>
  </div>

  <!-- Section label -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:130px; width:600px; z-index:11;">
    <div style="display:inline-block; background:#F5C518; padding:8px 18px 6px;">
      <span class="display" style="font-size:26px; color:#1A1A1A; letter-spacing:0.18em;">A HUNGRY TRAVELLER'S GUIDE</span>
    </div>
  </div>

  <!-- Main title -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:200px; width:1020px; z-index:11;">
    <div class="serif" style="font-size:196px; line-height:0.92; color:#1A1A1A; font-weight:400;">City<br><span style="color:#E63946; font-style:italic;">Food</span><br>Explorer</div>
  </div>

  <!-- Hand-drawn map underline scribble -->
  <svg data-object="true" data-object-type="shape" style="position:absolute; left:70px; top:770px; width:640px; height:44px; z-index:12;" viewBox="0 0 640 44">
    <path d="M 6 24 Q 60 6, 120 22 T 240 24 Q 320 8, 400 22 T 560 20 L 620 26" stroke="#1F3A93" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/>
    <circle cx="620" cy="26" r="7" fill="#1F3A93"/>
    <path d="M 8 24 L 2 20 M 8 24 L 2 28" stroke="#1F3A93" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- Deck / subtitle -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:830px; width:900px; z-index:11;">
    <div class="serif" style="font-size:34px; line-height:1.25; color:#1A1A1A; font-style:italic;">A hand-drawn map to the city's most<br>delicious corners — from first coffee<br>to last-call noodles.</div>
  </div>

  <!-- Bottom rule + credits -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:80px; top:1010px; width:980px; height:2px; background:#1A1A1A; z-index:11;"></div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:1030px; width:600px; z-index:11;">
    <div class="mono" style="font-size:14px; color:#1A1A1A; letter-spacing:0.18em; font-weight:700;">EDITED BY THE APPETITE DESK · 6 STOPS · 1 CITY</div>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:780px; top:1030px; width:280px; z-index:11; text-align:right;">
    <div class="mono" style="font-size:14px; color:#1A1A1A; letter-spacing:0.18em; font-weight:700;">P. 01 / 06</div>
  </div>

  <!-- Right panel: burger cutout hero -->
  <div data-object="true" data-object-type="image" style="position:absolute; left:1220px; top:280px; width:620px; height:620px; border-radius:50%; overflow:hidden; z-index:6; box-shadow:0 20px 60px rgba(0,0,0,0.25);">
    <img src="../assets/burger.jpg" style="width:100%; height:100%; object-fit:cover;">
  </div>

  <!-- Right panel: hand-drawn "eat here" scribble -->
  <svg data-object="true" data-object-type="shape" style="position:absolute; left:1180px; top:230px; width:720px; height:720px; z-index:8; pointer-events:none;" viewBox="0 0 720 720">
    <circle cx="360" cy="360" r="320" stroke="#FBF6EC" stroke-width="3" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  </svg>

  <!-- Sticker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1200px; top:150px; width:220px; height:120px; z-index:12; transform:rotate(-8deg);">
    <div style="background:#F5C518; padding:16px 22px; text-align:center; box-shadow:0 6px 0 #1A1A1A;">
      <div class="mono" style="font-size:14px; letter-spacing:0.2em; color:#1A1A1A; font-weight:700;">FIELD GUIDE</div>
      <div class="serif" style="font-size:32px; color:#1A1A1A; line-height:1;">Eat Here.</div>
    </div>
  </div>

  <!-- Right panel: caption -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1180px; top:930px; width:660px; z-index:11; text-align:center;">
    <div class="hand" style="font-size:44px; color:#FBF6EC; line-height:1;">— follow the crumbs —</div>
  </div>

  <!-- Compass rose bottom-left -->
  <svg data-object="true" data-object-type="icon" style="position:absolute; left:940px; top:900px; width:110px; height:110px; z-index:12;" viewBox="0 0 110 110">
    <circle cx="55" cy="55" r="50" stroke="#1F3A93" stroke-width="3" fill="none"/>
    <path d="M 55 12 L 62 55 L 55 98 L 48 55 Z" fill="#1F3A93"/>
    <path d="M 12 55 L 55 48 L 98 55 L 55 62 Z" fill="#E63946"/>
    <circle cx="55" cy="55" r="4" fill="#1A1A1A"/>
    <text x="55" y="10" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" font-weight="700" fill="#1A1A1A">N</text>
  </svg>

</div>
</body>
</html>

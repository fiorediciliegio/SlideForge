<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Bebas+Neue&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; font-family:'Space Grotesk',sans-serif; }
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#FFEB3B;">

  <!-- Magenta corner block -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:840px; height:760px; background:#E5006E; z-index:1;"></div>

  <!-- Cobalt diagonal band -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1080px; top:-60px; width:760px; height:440px; background:#1A3FE0; transform:rotate(-10deg); z-index:1;"></div>

  <!-- Bright red circle burst -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1400px; top:460px; width:440px; height:440px; background:#FF2A1F; border-radius:50%; z-index:1;"></div>

  <!-- Black underscore bar -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:100px; top:940px; width:900px; height:24px; background:#111111; z-index:1;"></div>

  <!-- Tiny yellow dot near red circle -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1360px; top:520px; width:70px; height:70px; background:#FFEB3B; border-radius:50%; z-index:2;"></div>

  <!-- Star burst outline -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1480px; top:540px; width:280px; height:280px; z-index:3;">
    <svg width="280" height="280" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,2 58,38 96,38 65,60 76,96 50,74 24,96 35,60 4,38 42,38" fill="#FFEB3B" stroke="#111" stroke-width="2"></polygon>
    </svg>
  </div>

  <!-- CLUB tag top-left -->
  <div data-object="true" data-object-type="textbox" style="position: absolute; left: 100px; top: 90px; width: 683.895px; z-index: 10; font-family: &quot;Space Grotesk&quot;, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 6px; color: rgb(255, 235, 59); text-transform: uppercase; height: 75px; transform: none !important;">
    ★ Campus Club × 2026 Intake ★
  </div>

  <!-- YEAR big -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:100px; top:180px; width:720px; z-index:10; font-family:'Archivo Black',sans-serif; font-size:196px; line-height:0.9; color:#FFFFFF; letter-spacing:-6px;">
    JOIN<br>THE<br>CLUB!
  </div>

  <!-- Subtitle line -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:900px; top:220px; width:500px; z-index:10; font-family:'Bebas Neue',sans-serif; font-size:88px; line-height:0.95; color:#111111; letter-spacing:1px;">
    UNIVERSITY<br>CLUB<br><span style="color:#E5006E;">RECRUITMENT</span><br>CAMPAIGN
  </div>

  <!-- Bottom stripe with meta -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:1000px; width:1920px; height:80px; background:#111111; z-index:2;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:100px; top:1018px; width:1000px; height:50px; z-index:11; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:#FFEB3B; letter-spacing:4px; text-transform:uppercase;">
    ▲ New Semester · New Faces · New Energy ▲
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1500px; top:1018px; width:340px; height:50px; z-index:11; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:#FFFFFF; letter-spacing:4px; text-align:right;">
    ISSUE — 01 / 06
  </div>

  <!-- Big number 26 sitting inside the star -->
  

</div>


</body></html>

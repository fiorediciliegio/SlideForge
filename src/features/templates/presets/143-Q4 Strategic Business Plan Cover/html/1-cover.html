:root {
  --theme-bg: #071A33;
  --theme-surface: #0B2547;
  --theme-ink: #E8EEF6;
  --theme-muted: #9EB4CE;
  --theme-accent-primary: #DA1330;
  --theme-accent-secondary: #16406E;
  --theme-accent-tertiary: #FF5C72;
  --theme-line: #27517D;

  --strategy-canvas: var(--theme-bg);
  --strategy-surface: var(--theme-surface);
  --strategy-ink: var(--theme-ink);
  --strategy-muted: var(--theme-muted);
  --strategy-accent: var(--theme-accent-primary);
  --strategy-support: var(--theme-accent-secondary);
  --strategy-highlight: var(--theme-accent-tertiary);
  --strategy-line: var(--theme-line);
  --strategy-shadow: rgb(from var(--strategy-ink) r g b / 0.18);
  --strategy-glow: rgb(from var(--strategy-accent) r g b / 0.22);
}

  html,body{margin:0;padding:0;overflow:hidden;background:var(--strategy-canvas);}
  .t-display{font-family:'Archivo',sans-serif;}
  .t-mono{font-family:'IBM Plex Mono',monospace;}

  /* Frosted-glass numeral: the glyph itself is the glass, not a plate behind it.
     Fill = diffused milky version of the red field it sits on (what frosted glass
     actually does to a backdrop), plus a bright edge and a cast shadow for thickness. */
  .glass-numeral{
    color:transparent;
    -webkit-background-clip:text;
    background-clip:text;
    background-image:linear-gradient(158deg,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g + 17) calc(b + 9) / 0.96) 0%,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g - 4) calc(b - 8) / 0.82) 17%,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g - 52) calc(b - 47) / 0.54) 36%,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g + 17) calc(b + 9) / 0.90) 54%,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g - 70) calc(b - 62) / 0.46) 73%,
      rgb(from var(--strategy-ink) calc(r + 23) calc(g - 12) calc(b - 13) / 0.74) 100%);
    -webkit-text-stroke:2.5px rgb(from var(--strategy-ink) calc(r + 23) calc(g + 17) calc(b + 9) / 0.52);
    filter:
      drop-shadow(0 1px 0 rgb(from var(--strategy-ink) calc(r + 23) calc(g + 17) calc(b + 9) / 0.55))
      drop-shadow(0 20px 38px rgb(from var(--strategy-canvas) calc(r + 45) calc(g - 23) calc(b - 39) / 0.45));
  }
</style>

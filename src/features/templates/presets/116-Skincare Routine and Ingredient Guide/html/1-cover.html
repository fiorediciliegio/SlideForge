<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; background:#F6EFE7; font-family:'Inter',sans-serif; }
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#F6EFE7;">

  <!-- Cover image right side -->
  <div data-object="true" data-object-type="image" style="position:absolute; left:960px; top:0px; width:960px; height:1080px; z-index:5;">
    <img src="../assets/cover.jpg" style="width:100%; height:100%; object-fit:cover; display:block;">
  </div>

  <!-- Left cream panel background shape -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0px; top:0px; width:960px; height:1080px; background:#F6EFE7; z-index:1;"></div>

  <!-- Top brand mark -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:80px; width:400px; z-index:10; font-family:'Inter',sans-serif; font-size:14px; letter-spacing:0.45em; color:#1a1a1a; font-weight:500;">
    THE EDIT · VOLUME No. 01
  </div>

  <!-- Thin horizontal rule -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:120px; top:130px; width:60px; height:1px; background:#1a1a1a; z-index:10;"></div>

  <!-- Small burgundy dot -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:195px; top:127px; width:6px; height:6px; background:#5C1F2B; border-radius:50%; z-index:10;"></div>

  <!-- Kicker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:270px; width:800px; z-index:10; font-family:'Inter',sans-serif; font-size:15px; letter-spacing:0.35em; color:#5C1F2B; font-weight:500; text-transform:uppercase;">
    A Modern Guide to Skin
  </div>

  <!-- Main headline -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:320px; width:820px; z-index:10; font-family:'Cormorant Garamond',serif; font-size:132px; line-height:0.95; color:#1a1a1a; font-weight:300; letter-spacing:-0.02em;">
    Skincare<br><em style="font-weight:300; color:#5C1F2B;">Routine</em><br>&amp; Ingredients
  </div>

  <!-- Subtitle description -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:790px; width:680px; z-index:10; font-family:'Cormorant Garamond',serif; font-size:22px; line-height:1.6; color:#3a3a3a; font-weight:400; font-style:italic;">
    A considered guide to skin — types, ingredients, and rituals for the modern routine, edited for the everyday.
  </div>

  <!-- Bottom meta -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:960px; width:400px; z-index:10; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:0.35em; color:#1a1a1a; font-weight:400;">
    ISSUE 01 &nbsp;·&nbsp; THE ESSENTIALS
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1720px; top:960px; width:120px; z-index:10; font-family:'Cormorant Garamond',serif; font-size:14px; letter-spacing:0.3em; color:#F6EFE7; font-weight:400; text-align:right;">
    01 / 10
  </div>

</div>
</body>
</html>

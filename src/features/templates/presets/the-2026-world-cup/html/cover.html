<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cover · 2026 FIFA World Cup</title>
</head>
<body>
<div class="slide" data-screen-label="01 Cover"
  style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#0B1F4B;">

  <!-- 背景大对角红块 shape -->
  <div data-object="true" data-object-type="shape"
    style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;
    background:
      linear-gradient(115deg, transparent 0%, transparent 55%, #E30613 55%, #E30613 100%),
      radial-gradient(circle at 78% 30%, rgba(247,183,51,.18), transparent 55%),
      linear-gradient(180deg,#0B1F4B 0%, #06132f 100%);">
  </div>

  <!-- 大网格线装饰 shape -->
  <div data-object="true" data-object-type="shape"
    style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2;opacity:.10;
    background-image:
      linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size:120px 120px;"></div>

  <!-- 顶部标签 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:120px;top:96px;width:900px;z-index:10;">
    <div class="uppercase tracking f-display" style="color:#F7B733;font-size:22px;font-weight:400;">FIFA World Cup · Canada · Mexico · USA</div>
    <div class="f-body" style="color:rgba(255,255,255,.72);font-size:20px;margin-top:14px;letter-spacing:.02em;">第 23 届国际足联世界杯 · 全景回顾</div>
  </div>

  <!-- 巨号年份 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:110px;top:200px;width:1100px;height:540px;z-index:10;">
    <div class="f-display" style="font-size:480px;line-height:1;color:#ffffff;font-weight:400;letter-spacing:-.02em;">
      20<span style="color:#F7B733;">26</span>
    </div>
  </div>

  <!-- 中文主标题 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:120px;top:790px;width:900px;z-index:10;">
    <div class="f-body" style="color:#ffffff;font-size:64px;font-weight:900;line-height:1.05;letter-spacing:.02em;">
      世界杯，来了。
    </div>
    <div class="f-body" style="color:rgba(255,255,255,.78);font-size:22px;font-weight:400;margin-top:18px;line-height:1.55;">
      104 场比赛 · 48 支球队 · 16 座城市 · 3 个国家<br>
      一届被历史铭记的世界杯
    </div>
  </div>

  <!-- 右侧巨型口号 WE ARE 26 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:1080px;top:250px;width:760px;z-index:10;text-align:right;">
    <div class="f-display uppercase" style="font-size:44px;color:#ffffff;line-height:1;letter-spacing:.08em;opacity:.9;">We are</div>
    <div class="f-display" style="font-size:360px;color:#ffffff;line-height:.85;font-weight:400;letter-spacing:-.02em;margin-top:6px;">26</div>
    <div class="f-display uppercase tracking" style="font-size:16px;color:rgba(255,255,255,.7);margin-top:20px;">official rallying cry</div>
  </div>

  <!-- 右侧信息条 -->
  <div data-object="true" data-object-type="shape"
    style="position:absolute;left:1080px;top:800px;width:720px;height:2px;z-index:9;background:rgba(255,255,255,.35);"></div>

  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:1080px;top:830px;width:720px;z-index:10;">
    <div style="display:flex;justify-content:space-between;gap:24px;color:#ffffff;">
      <div>
        <div class="f-display uppercase tracking" style="font-size:13px;opacity:.6;">Kickoff</div>
        <div class="f-num" style="font-size:34px;letter-spacing:.02em;margin-top:4px;">JUN 11</div>
      </div>
      <div>
        <div class="f-display uppercase tracking" style="font-size:13px;opacity:.6;">Final</div>
        <div class="f-num" style="font-size:34px;letter-spacing:.02em;margin-top:4px;">JUL 19</div>
      </div>
      <div>
        <div class="f-display uppercase tracking" style="font-size:13px;opacity:.6;">Duration</div>
        <div class="f-num" style="font-size:34px;letter-spacing:.02em;margin-top:4px;">39 DAYS</div>
      </div>
    </div>
  </div>

  <!-- 底部三国标 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:120px;top:990px;width:900px;z-index:10;">
    <div class="f-body" style="color:rgba(255,255,255,.55);font-size:15px;letter-spacing:.18em;">
      🇨🇦 CANADA &nbsp;&nbsp;·&nbsp;&nbsp; 🇲🇽 MEXICO &nbsp;&nbsp;·&nbsp;&nbsp; 🇺🇸 UNITED STATES
    </div>
  </div>

  <!-- 页脚编号 -->
  <div data-object="true" data-object-type="textbox"
    style="position:absolute;left:1720px;top:990px;width:100px;z-index:10;text-align:right;">
    <div class="f-num" style="color:rgba(255,255,255,.55);font-size:18px;letter-spacing:.2em;">01 / 05</div>
  </div>

</div>
</body>
</html>

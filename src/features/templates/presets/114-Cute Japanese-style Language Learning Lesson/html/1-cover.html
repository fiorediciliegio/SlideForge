<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; overflow:hidden; font-family:'Nunito', sans-serif; }
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#FFF9F3;">

  <!-- Soft background wash -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:1; background:
    radial-gradient(circle at 15% 20%, #FADADD55 0%, transparent 40%),
    radial-gradient(circle at 85% 15%, #C8E6D055 0%, transparent 42%),
    radial-gradient(circle at 80% 85%, #E0D4F055 0%, transparent 40%),
    radial-gradient(circle at 20% 90%, #FFF2B855 0%, transparent 40%),
    #FFF9F3;"></div>

  <!-- Dotted grid overlay -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:2; opacity:0.35; background-image: radial-gradient(#F5C6CB 1.5px, transparent 1.5px); background-size: 40px 40px;"></div>

  <!-- Floating decorative shapes -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:120px; top:120px; width:90px; height:90px; z-index:3; background:#FADADD; border-radius:50%; border:4px solid #F0A5AD;"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1720px; top:180px; width:70px; height:70px; z-index:3; background:#FFF2B8; border-radius:22px; border:4px solid #E8C960; transform:rotate(15deg);"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1780px; top:820px; width:80px; height:80px; z-index:3; background:#C8E6D0; border-radius:50%; border:4px solid #8FC49D;"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute; left:100px; top:880px; width:75px; height:75px; z-index:3; background:#E0D4F0; border-radius:22px; border:4px solid #B8A6D4; transform:rotate(-12deg);"></div>

  <!-- Sparkles -->
  <div data-object="true" data-object-type="icon" style="position:absolute; left:260px; top:280px; width:36px; height:36px; z-index:10;">
    <svg viewBox="0 0 40 40"><path d="M20 4 L23 17 L36 20 L23 23 L20 36 L17 23 L4 20 L17 17 Z" fill="#F5B942" stroke="#D89422" stroke-width="1.5"/></svg>
  </div>
  <div data-object="true" data-object-type="icon" style="position:absolute; left:1600px; top:380px; width:28px; height:28px; z-index:10;">
    <svg viewBox="0 0 40 40"><path d="M20 4 L23 17 L36 20 L23 23 L20 36 L17 23 L4 20 L17 17 Z" fill="#F5B942" stroke="#D89422" stroke-width="1.5"/></svg>
  </div>
  <div data-object="true" data-object-type="icon" style="position:absolute; left:1500px; top:900px; width:32px; height:32px; z-index:10;">
    <svg viewBox="0 0 40 40"><path d="M20 4 L23 17 L36 20 L23 23 L20 36 L17 23 L4 20 L17 17 Z" fill="#B8A6D4" stroke="#8A76A8" stroke-width="1.5"/></svg>
  </div>
  <div data-object="true" data-object-type="icon" style="position:absolute; left:340px; top:820px; width:26px; height:26px; z-index:10;">
    <svg viewBox="0 0 40 40"><path d="M20 4 L23 17 L36 20 L23 23 L20 36 L17 23 L4 20 L17 17 Z" fill="#8FC49D" stroke="#5E9670" stroke-width="1.5"/></svg>
  </div>

  <!-- Wobbly badge -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:760px; top:120px; width:400px; height:70px; z-index:5; background:#FFF; border:4px solid #F5B5BF; border-radius:40px; box-shadow:0 6px 0 #F5B5BF33;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:760px; top:120px; width:400px; height:70px; z-index:10; display:flex; align-items:center; justify-content:center; gap:12px; font-family:'Fredoka', sans-serif; font-size:26px; font-weight:600; color:#D97583;">
    <span style="font-size:24px;">🌸</span> Lesson 01 · Beginner <span style="font-size:24px;">🌸</span>
  </div>

  <!-- Main title -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:180px; top:260px; width:1560px; height:200px; z-index:10; text-align:center; font-family:'Fredoka', sans-serif; font-size:150px; font-weight:700; color:#5C4A6E; line-height:1;">
    Let's Learn <span style="color:#E88A9A;">Japanese!</span>
  </div>

  <!-- Handwritten subtitle -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:180px; top:445px; width:1560px; height:70px; z-index:10; text-align:center; font-family:'Kalam', cursive; font-size:38px; font-weight:400; color:#8A7CA8;">
    ～ a cozy little classroom for curious beginners ～
  </div>

  <!-- Central illustration: sushi + cat + rice ball -->
  <!-- Rice ball (onigiri) -->
  <div data-object="true" data-object-type="icon" style="position:absolute; left:620px; top:600px; width:220px; height:220px; z-index:10;">
    <svg viewBox="0 0 220 220">
      <path d="M110 20 Q40 40 30 180 Q30 200 50 200 L170 200 Q190 200 190 180 Q180 40 110 20 Z" fill="#FFFFFF" stroke="#5C4A6E" stroke-width="4"/>
      <rect x="55" y="130" width="110" height="55" rx="6" fill="#3A3846" stroke="#5C4A6E" stroke-width="4"/>
      <circle cx="85" cy="105" r="6" fill="#5C4A6E"/>
      <circle cx="135" cy="105" r="6" fill="#5C4A6E"/>
      <path d="M100 120 Q110 128 120 120" stroke="#5C4A6E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="118" rx="10" ry="6" fill="#F5B5BF" opacity="0.7"/>
      <ellipse cx="150" cy="118" rx="10" ry="6" fill="#F5B5BF" opacity="0.7"/>
    </svg>
  </div>

  <!-- Cat -->
  <div data-object="true" data-object-type="icon" style="position:absolute; left:880px; top:580px; width:260px; height:260px; z-index:10;">
    <svg viewBox="0 0 260 260">
      <!-- body -->
      <ellipse cx="130" cy="180" rx="90" ry="70" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4"/>
      <!-- head -->
      <circle cx="130" cy="110" r="75" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4"/>
      <!-- ears -->
      <path d="M70 70 L60 30 L100 55 Z" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4" stroke-linejoin="round"/>
      <path d="M190 70 L200 30 L160 55 Z" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4" stroke-linejoin="round"/>
      <path d="M75 62 L70 45 L88 55 Z" fill="#F5B5BF"/>
      <path d="M185 62 L190 45 L172 55 Z" fill="#F5B5BF"/>
      <!-- cheeks -->
      <circle cx="88" cy="125" r="12" fill="#F5B5BF" opacity="0.8"/>
      <circle cx="172" cy="125" r="12" fill="#F5B5BF" opacity="0.8"/>
      <!-- eyes -->
      <path d="M100 100 Q108 108 116 100" stroke="#3A3846" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M144 100 Q152 108 160 100" stroke="#3A3846" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- nose + mouth -->
      <path d="M127 118 L130 122 L133 118 Z" fill="#3A3846"/>
      <path d="M130 122 Q124 130 118 126 M130 122 Q136 130 142 126" stroke="#3A3846" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- paws -->
      <ellipse cx="80" cy="235" rx="22" ry="14" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4"/>
      <ellipse cx="180" cy="235" rx="22" ry="14" fill="#FFF2B8" stroke="#5C4A6E" stroke-width="4"/>
    </svg>
  </div>

  <!-- Sushi -->
  <div data-object="true" data-object-type="icon" style="position:absolute; left:1180px; top:620px; width:200px; height:180px; z-index:10;">
    <svg viewBox="0 0 200 180">
      <!-- rice base -->
      <ellipse cx="100" cy="120" rx="85" ry="40" fill="#FFFFFF" stroke="#5C4A6E" stroke-width="4"/>
      <!-- salmon top -->
      <path d="M20 90 Q100 60 180 90 Q180 105 175 115 Q100 90 25 115 Q20 105 20 90 Z" fill="#FF9E9E" stroke="#5C4A6E" stroke-width="4" stroke-linejoin="round"/>
      <!-- salmon stripes -->
      <path d="M40 92 Q100 78 160 92" stroke="#FFF" stroke-width="3" fill="none"/>
      <path d="M35 100 Q100 88 165 100" stroke="#FFF" stroke-width="2.5" fill="none"/>
      <!-- face -->
      <circle cx="80" cy="130" r="3" fill="#5C4A6E"/>
      <circle cx="120" cy="130" r="3" fill="#5C4A6E"/>
      <path d="M95 138 Q100 142 105 138" stroke="#5C4A6E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="138" rx="7" ry="4" fill="#F5B5BF" opacity="0.7"/>
      <ellipse cx="130" cy="138" rx="7" ry="4" fill="#F5B5BF" opacity="0.7"/>
    </svg>
  </div>

  <!-- Speech bubble Konnichiwa (above cat, tail pointing down to it) -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1290px; top:530px; width:320px; height:120px; z-index:11; background:#FFF; border:4px solid #8FC49D; border-radius:55px;"></div>
  <div data-object="true" data-object-type="icon" style="position:absolute; left:1330px; top:645px; width:38px; height:32px; z-index:12;">
    <svg viewBox="0 0 38 32"><path d="M2 0 L36 0 L18 28 Z" fill="#FFF" stroke="#8FC49D" stroke-width="4" stroke-linejoin="round"/><rect x="4" y="0" width="30" height="4" fill="#FFF"/></svg>
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:1290px; top:530px; width:320px; height:120px; z-index:13; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Fredoka', sans-serif; font-weight:600; color:#4A8558; text-align:center;">
    <div style="font-size:34px; line-height:1;">こんにちは!</div>
    <div style="font-size:18px; color:#8A7CA8; margin-top:6px;">Konnichiwa!</div>
  </div>

  <!-- Bottom info bar -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:560px; top:930px; width:800px; height:80px; z-index:5; background:#FFF; border:4px solid #E0D4F0; border-radius:50px;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:560px; top:930px; width:800px; height:80px; z-index:10; display:flex; align-items:center; justify-content:center; gap:40px; font-family:'Nunito', sans-serif; font-size:22px; font-weight:700; color:#5C4A6E;">
    <span>🌷 25 min lesson</span>
    <span style="color:#E0D4F0;">|</span>
    <span>📚 6 stops</span>
    <span style="color:#E0D4F0;">|</span>
    <span>✨ Beginner N5</span>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>Cover</title>
<style>
/* ==== COMIC BOOK DESIGN SYSTEM ==== */
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Bowlby+One&family=Luckiest+Guy&family=Comic+Neue:wght@400;700&family=Permanent+Marker&display=swap');

:root {
  --red: #ED1C24;
  --yellow: #FFDE17;
  --sky: #29ABE2;
  --white: #FFFFFF;
  --black: #111111;
  --paper: #FFF8E7;

  --font-title: 'Bangers', 'Bowlby One', sans-serif;
  --font-pow: 'Luckiest Guy', 'Bangers', sans-serif;
  --font-body: 'Comic Neue', 'Comic Sans MS', sans-serif;
  --font-hand: 'Permanent Marker', cursive;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: var(--font-body);
  color: var(--black);
}

/* Halftone dot pattern */
.halftone-red {
  background-image: radial-gradient(circle, var(--red) 2px, transparent 2.5px);
  background-size: 18px 18px;
}
.halftone-yellow {
  background-image: radial-gradient(circle, var(--yellow) 2.5px, transparent 3px);
  background-size: 16px 16px;
}
.halftone-black {
  background-image: radial-gradient(circle, var(--black) 2px, transparent 2.5px);
  background-size: 18px 18px;
}
.halftone-sky {
  background-image: radial-gradient(circle, var(--sky) 2.5px, transparent 3px);
  background-size: 16px 16px;
}

/* Diagonal speed lines */
.speedlines {
  background: repeating-linear-gradient(
    -25deg,
    var(--black) 0 3px,
    transparent 3px 22px
  );
}
.speedlines-white {
  background: repeating-linear-gradient(
    -25deg,
    var(--white) 0 4px,
    transparent 4px 26px
  );
}

/* Radial burst */
.burst-lines {
  background: repeating-conic-gradient(
    from 0deg,
    var(--black) 0deg 3deg,
    transparent 3deg 12deg
  );
}
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#FFDE17;">

  <!-- Halftone red backdrop stripe -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:1; background-image: radial-gradient(circle, #ED1C24 3px, transparent 3.5px); background-size: 22px 22px; opacity:0.35;"></div>

  <!-- Radial burst behind title -->
  <svg data-object="true" data-object-type="shape" style="position:absolute; left:60px; top:60px; width:1200px; height:900px; z-index:2;" viewBox="0 0 1200 900">
    <g transform="translate(600 470)">
      <g id="burst">
        <path d="M0,-460 L40,-160 L-40,-160 Z" fill="#FFFFFF" stroke="#111" stroke-width="6"></path>
      </g>
      <use href="#burst" transform="rotate(30)"></use>
      <use href="#burst" transform="rotate(60)"></use>
      <use href="#burst" transform="rotate(90)"></use>
      <use href="#burst" transform="rotate(120)"></use>
      <use href="#burst" transform="rotate(150)"></use>
      <use href="#burst" transform="rotate(180)"></use>
      <use href="#burst" transform="rotate(210)"></use>
      <use href="#burst" transform="rotate(240)"></use>
      <use href="#burst" transform="rotate(270)"></use>
      <use href="#burst" transform="rotate(300)"></use>
      <use href="#burst" transform="rotate(330)"></use>
    </g>
  </svg>

  <!-- Main title block -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:200px; width:1180px; z-index:10; transform: rotate(-3deg);">
    <div style="background:#ED1C24; border:8px solid #111; padding:20px 40px; box-shadow: 12px 12px 0 #111; display:inline-block;">
      <div style="font-family: var(--font-title); font-size:120px; color:#FFDE17; letter-spacing:4px; -webkit-text-stroke: 3px #111; line-height:1;">SCIENCE!</div>
    </div>
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute; left:180px; top:400px; width:1100px; z-index:10; transform: rotate(2deg);">
    <div style="background:#29ABE2; border:8px solid #111; padding:24px 40px; box-shadow: 12px 12px 0 #111; display:inline-block;">
      <div style="font-family: var(--font-title); font-size:96px; color:#FFFFFF; letter-spacing:3px; -webkit-text-stroke: 2px #111; line-height:1;">COMIC LESSON</div>
    </div>
  </div>

  <!-- Subtitle sticker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:200px; top:600px; width:900px; z-index:10; transform: rotate(-1.5deg);">
    <div style="background:#FFFFFF; border:6px solid #111; padding:20px 36px; box-shadow: 8px 8px 0 #111;">
      <div style="font-family: var(--font-pow); font-size:52px; color:#111; letter-spacing:1px;">Episode #1: The Shocking Balloon!</div>
    </div>
  </div>

  <!-- Issue tag -->
  

  <!-- Character panel: kid with balloon, right side -->
  <div data-object="true" data-object-type="image" style="position:absolute; left:1330px; top:120px; width:520px; height:820px; z-index:5; background:#FFFFFF; border:10px solid #111; box-shadow: 14px 14px 0 #111; transform: rotate(3deg); overflow:hidden;">
    <!-- inner scene -->
    <div style="position:absolute; inset:0; background: radial-gradient(circle at 50% 40%, #FFDE17 0%, #FFDE17 40%, #29ABE2 40.5%, #29ABE2 100%);"></div>
    <!-- speed lines -->
    <div style="position:absolute; inset:0; background: repeating-linear-gradient(-25deg, rgba(17,17,17,0.55) 0 3px, transparent 3px 24px); mix-blend-mode:multiply; opacity:0.7;"></div>

    <!-- Kid character SVG -->
    <svg style="position:absolute; left:40px; top:180px; width:440px; height:600px;" viewBox="0 0 440 600">
      <!-- body -->
      <path d="M140,420 Q130,560 170,590 L280,590 Q320,560 305,420 Z" fill="#29ABE2" stroke="#111" stroke-width="8" stroke-linejoin="round"></path>
      <!-- shirt stripe -->
      <rect x="140" y="470" width="170" height="24" fill="#FFDE17" stroke="#111" stroke-width="5"></rect>
      <!-- neck -->
      <rect x="200" y="380" width="45" height="50" fill="#FFD9B3" stroke="#111" stroke-width="6"></rect>
      <!-- head -->
      <ellipse cx="222" cy="310" rx="110" ry="115" fill="#FFD9B3" stroke="#111" stroke-width="8"></ellipse>
      <!-- hair spikes (frizzed from static!) -->
      <path d="M120,240 L100,150 L145,220 L130,140 L170,210 L175,130 L210,205 L220,120 L245,205 L265,135 L280,215 L305,145 L295,225 L340,160 L320,240" fill="#111" stroke="#111" stroke-width="6" stroke-linejoin="round"></path>
      <!-- eyes -->
      <circle cx="185" cy="305" r="16" fill="#fff" stroke="#111" stroke-width="5"></circle>
      <circle cx="260" cy="305" r="16" fill="#fff" stroke="#111" stroke-width="5"></circle>
      <circle cx="189" cy="308" r="7" fill="#111"></circle>
      <circle cx="264" cy="308" r="7" fill="#111"></circle>
      <!-- mouth: big open smile -->
      <path d="M180,355 Q222,395 265,355 Q245,375 222,377 Q200,375 180,355 Z" fill="#111" stroke="#111" stroke-width="4"></path>
      <!-- cheeks -->
      <circle cx="150" cy="345" r="14" fill="#ED1C24" opacity="0.6"></circle>
      <circle cx="295" cy="345" r="14" fill="#ED1C24" opacity="0.6"></circle>
      <!-- arm reaching up -->
      <path d="M305,440 Q360,380 340,300" fill="none" stroke="#111" stroke-width="8"></path>
      <path d="M295,440 Q350,380 330,300" fill="#29ABE2" stroke="#111" stroke-width="8" stroke-linejoin="round"></path>
      <!-- hand -->
      <circle cx="335" cy="290" r="22" fill="#FFD9B3" stroke="#111" stroke-width="6"></circle>
    </svg>

    <!-- Balloon floating -->
    <svg style="position:absolute; left:280px; top:20px; width:180px; height:220px;" viewBox="0 0 180 220">
      <ellipse cx="90" cy="90" rx="75" ry="82" fill="#ED1C24" stroke="#111" stroke-width="8"></ellipse>
      <ellipse cx="65" cy="65" rx="16" ry="22" fill="#fff" opacity="0.7"></ellipse>
      <path d="M80,170 L90,180 L100,170 L95,190 L90,175 Z" fill="#ED1C24" stroke="#111" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M90,182 Q78,220 90,240" stroke="#111" stroke-width="4" fill="none"></path>
      <!-- zap sparks -->
      <path d="M40,50 L25,35 L45,40 L30,20" stroke="#FFDE17" stroke-width="5" fill="none" stroke-linecap="round"></path>
      <path d="M150,60 L165,45 L145,50 L160,30" stroke="#FFDE17" stroke-width="5" fill="none" stroke-linecap="round"></path>
    </svg>

    <!-- ZAP! bubble -->
    <div style="position:absolute; left:20px; top:40px; transform: rotate(-12deg);">
      <div style="background:#FFDE17; border:6px solid #111; padding:8px 20px; font-family: var(--font-pow); font-size:44px; color:#ED1C24; -webkit-text-stroke:2px #111; box-shadow: 6px 6px 0 #111;">ZAP!</div>
    </div>
  </div>

  <!-- Bottom badge -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:120px; top:900px; width:1000px; z-index:10;">
    <div style="font-family: var(--font-title); font-size:56px; color:#111; letter-spacing:3px;">
      ★ WHY DOES A BALLOON STICK TO YOUR HAIR? ★
    </div>
  </div>

  <!-- Comic-page number -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1720px; top:960px; width:140px; height:100px; z-index:10; background:#111; border:6px solid #111; transform: rotate(-4deg); display:flex; align-items:center; justify-content:center;">
    <div style="font-family: var(--font-title); font-size:56px; color:#FFDE17; letter-spacing:2px;">01</div>
  </div>

</div>


</body></html>

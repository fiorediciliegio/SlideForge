<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inside the Beehive — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Clay Knowledge Cards — shared visual identity
   Appearance only (surfaces, texture, typography). All layout/position is
   authored inline on each data-object so the editor keeps its coordinates.
   Lighting: single soft light from the upper-left on every object.
   ========================================================================== */

:root{
  --cream:#FDF6E9;
  --cream-2:#F8EEDC;

  --mint:#9DDCBF;   --mint-d:#6BC29E;  --mint-l:#C6EFDC;
  --orange:#F3A263; --orange-d:#DD8340; --orange-l:#FBC998;
  --lav:#C5B7EB;    --lav-d:#A492DA;   --lav-l:#DFD6F7;
  --butter:#FAD86C; --butter-d:#EBBF3F; --butter-l:#FDEDB2;
  --blue:#A4D2F1;   --blue-d:#79B7E2;  --blue-l:#CEE8FA;

  --ink:#4A3728;
  --ink-soft:#7C6753;
  --ink-faint:#9C8974;
  --white:#FFFDF7;
}

/* --- clay surfaces: soft matte volume, never glossy ---------------------- */
.clay{
  box-shadow:
    inset 10px 12px 18px rgba(255,255,255,.55),
    inset -10px -13px 20px rgba(124,86,46,.16),
    0 22px 30px -16px rgba(124,90,50,.34);
}
.clay-s{
  box-shadow:
    inset 6px 7px 11px rgba(255,255,255,.58),
    inset -6px -8px 13px rgba(124,86,46,.16),
    0 13px 20px -11px rgba(124,90,50,.32);
}
.clay-in{
  box-shadow:
    inset 7px 9px 16px rgba(124,86,46,.20),
    inset -6px -7px 12px rgba(255,255,255,.55);
}

/* protected text area: a clean, style-consistent plate under copy */
.plate{
  background:rgba(255,253,247,.95);
  box-shadow:
    inset 5px 6px 10px rgba(255,255,255,.75),
    inset -5px -6px 11px rgba(140,105,65,.10),
    0 16px 26px -18px rgba(124,90,50,.30);
}

/* subtle handmade matte grain — extremely low contrast */
.grain{
  background-image:radial-gradient(rgba(124,86,46,.055) 1px, transparent 1.7px);
  background-size:7px 7px;
}

/* --- typography: rounded, friendly, highly legible ---------------------- */
.t-h{
  font-family:'Baloo 2','Trebuchet MS',sans-serif;
  font-weight:800; color:var(--ink); margin:0; letter-spacing:-.4px;
  text-wrap:pretty;
}
.t-b{
  font-family:'Nunito','Trebuchet MS',sans-serif;
  font-weight:600; color:var(--ink-soft); margin:0; text-wrap:pretty;
}
.t-k{
  font-family:'Nunito','Trebuchet MS',sans-serif;
  font-weight:800; color:var(--ink-faint); margin:0;
  letter-spacing:3.4px; text-transform:uppercase;
}
.src{
  font-family:'Nunito','Trebuchet MS',sans-serif;
  font-weight:700; color:var(--ink-faint); margin:0;
}
</style>
</head>
<body style="margin:0;padding:0;overflow:hidden;">

</body>

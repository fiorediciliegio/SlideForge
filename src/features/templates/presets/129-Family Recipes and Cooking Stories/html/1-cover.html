<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover — Family Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAF3E3;">

  <!-- Checked paper background -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;background:
      repeating-linear-gradient(0deg, rgba(198,45,40,0.06) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(90deg, rgba(198,45,40,0.06) 0 1px, transparent 1px 40px),
      #FAF3E3;z-index:1;"></div>

  <!-- Torn cream paper top band -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:150px;background:#FFF8E7;box-shadow:0 6px 0 rgba(0,0,0,0.04);z-index:2;"></div>

  <!-- Top little label sticker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:60px;width:520px;height:60px;font-family:'DM Sans';font-size:20px;letter-spacing:0.42em;color:#2E5D3A;font-weight:700;z-index:11;">
    A LITTLE COOKBOOK &nbsp;·&nbsp; VOL. 01
  </div>

  <!-- Date sticker top right -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1620px;top:50px;width:200px;height:70px;background:#FFD84D;border:2px dashed #2A3E7C;transform:rotate(3deg);z-index:11;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1620px;top:50px;width:200px;height:70px;line-height:70px;text-align:center;font-family:'Caveat',cursive;font-size:32px;color:#2A3E7C;transform:rotate(3deg);z-index:12;">
    made with love
  </div>

  <!-- Left column text -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:220px;width:900px;height:120px;font-family:'Shadows Into Light',cursive;font-size:70px;color:#C62D28;line-height:1;z-index:11;">
    our family's
  </div>

  <div data-object="true" data-object-type="textbox" style="position:absolute;left:110px;top:310px;width:960px;height:500px;font-family:'Fraunces',serif;font-weight:800;font-size:150px;line-height:1;color:#1F1A17;letter-spacing:-2px;z-index:11;">
    Recipes<br>&amp; Cooking<br>Stories
  </div>

  <!-- Underline squiggle -->
  <svg data-object="true" data-object-type="shape" style="position:absolute;left:120px;top:790px;width:640px;height:30px;z-index:11;" viewBox="0 0 640 30">
    <path d="M2 20 Q 60 2, 120 18 T 240 18 T 360 18 T 480 18 T 620 18" stroke="#2E5D3A" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- Subtitle -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:840px;width:820px;height:80px;font-family:'DM Sans';font-size:22px;line-height:1.5;color:#3B2F2A;z-index:11;">
    Handwritten pages from the kitchen — breakfasts, Sunday sauces, holiday cookies, and the stories we tell while we cook.
  </div>

  <!-- Author strip -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:940px;width:700px;height:50px;font-family:'Caveat',cursive;font-size:38px;color:#2A3E7C;z-index:11;">
    with love, from our kitchen to yours
  </div>

  <!-- Big polaroid hero image -->
  <div data-object="true" data-object-type="image" style="position:absolute;left:1080px;top:200px;width:720px;height:760px;background:#FFFDF5;padding:26px 26px 90px 26px;box-sizing:border-box;box-shadow:0 24px 44px rgba(58,32,18,0.22),0 4px 0 rgba(0,0,0,0.04);transform:rotate(-3deg);z-index:6;">
    <img src="../assets/cover.jpg" style="width:100%;height:644px;object-fit:cover;display:block;">
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1080px;top:200px;width:720px;height:760px;transform:rotate(-3deg);z-index:12;pointer-events:none;">
    <div style="position:absolute;left:0;bottom:24px;width:100%;text-align:center;font-family:'Caveat',cursive;font-size:38px;color:#3B2F2A;">
      the family table, Sunday morning
    </div>
  </div>

  <!-- Washi tape on polaroid -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1360px;top:170px;width:180px;height:44px;background:repeating-linear-gradient(90deg,#C62D28 0 14px,#FFFFFF 14px 28px);opacity:0.9;transform:rotate(-8deg);z-index:8;"></div>

  <!-- Small utensil sticker: whisk -->
  <svg data-object="true" data-object-type="icon" style="position:absolute;left:960px;top:820px;width:80px;height:80px;transform:rotate(-18deg);z-index:11;" viewBox="0 0 64 64">
    <rect x="28" y="4" width="8" height="26" rx="2" fill="#3B2F2A"/>
    <ellipse cx="32" cy="46" rx="18" ry="14" fill="none" stroke="#3B2F2A" stroke-width="3"/>
    <path d="M18 40 Q 32 60 46 40" stroke="#3B2F2A" stroke-width="2.5" fill="none"/>
    <path d="M22 34 Q 32 58 42 34" stroke="#3B2F2A" stroke-width="2.5" fill="none"/>
    <path d="M26 32 Q 32 56 38 32" stroke="#3B2F2A" stroke-width="2.5" fill="none"/>
  </svg>

  <!-- Sticker: tomato -->
  <svg data-object="true" data-object-type="icon" style="position:absolute;left:960px;top:920px;width:100px;height:100px;transform:rotate(10deg);z-index:11;" viewBox="0 0 100 100">
    <circle cx="50" cy="58" r="34" fill="#C62D28"/>
    <path d="M35 32 Q 42 22 50 26 Q 58 22 65 32 Q 58 30 50 32 Q 42 30 35 32Z" fill="#2E5D3A"/>
    <path d="M50 28 L 50 20" stroke="#2E5D3A" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 46 Q 48 52 44 62" stroke="#FFB0AB" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- Page number -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:1010px;width:200px;height:30px;font-family:'DM Sans';font-size:16px;letter-spacing:0.3em;color:#8A7A66;z-index:11;">
    — PAGE 01 —
  </div>

</div>
</body>
</html>

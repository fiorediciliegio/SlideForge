<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cover — Graduation Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&amp;family=Kalam:wght@300;400;700&amp;family=Shadows+Into+Light&amp;family=Playfair+Display:ital,wght@1,700&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#faf3ea;font-family:'Kalam',sans-serif;}
</style>
</head>
<body>
<div class="slide" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:
  radial-gradient(ellipse at 15% 20%, #fce8ea 0%, transparent 45%),
  radial-gradient(ellipse at 85% 80%, #dfeaf3 0%, transparent 50%),
  radial-gradient(ellipse at 70% 15%, #fbf1cf 0%, transparent 40%),
  #fbf5ec;">

  <!-- Paper grain overlay via SVG noise (subtle) -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:.35;pointer-events:none;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22/&gt;&lt;/filter&gt;&lt;rect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22 opacity=%220.25%22/&gt;&lt;/svg&gt;');"></div>

  <!-- Grid dots (very faint notebook feel) -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:.18;background-image:radial-gradient(#c9a99a 1.2px, transparent 1.4px);background-size:40px 40px;"></div>

  <!-- Torn-paper banner across top -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:60px;width:1920px;height:120px;z-index:2;background:#f5c9cf;transform:rotate(-1.2deg);transform-origin:center;box-shadow:0 6px 16px rgba(180,120,120,.18);clip-path:polygon(0 12%,3% 5%,8% 14%,13% 4%,18% 12%,24% 6%,30% 14%,36% 5%,42% 13%,49% 6%,55% 14%,61% 5%,68% 13%,74% 6%,81% 14%,87% 5%,93% 12%,100% 6%,100% 88%,96% 96%,90% 88%,84% 96%,77% 88%,70% 95%,63% 87%,56% 95%,49% 87%,42% 95%,35% 87%,28% 95%,21% 87%,14% 95%,7% 87%,0 95%);"></div>

  <!-- Decorative star cluster top-left -->
  <div data-object="true" data-object-type="icon" style="position:absolute;left:110px;top:210px;width:160px;height:160px;z-index:6;">
    <svg viewBox="0 0 160 160" width="160" height="160">
      <g fill="#e26d6d">
        <path d="M30 40 l4 12 l12 2 l-9 8 l3 12 l-10 -7 l-10 7 l3 -12 l-9 -8 l12 -2 z" opacity=".9"></path>
      </g>
      <g fill="#f5b942">
        <path d="M100 20 l3 8 l8 1 l-6 6 l2 8 l-7 -5 l-7 5 l2 -8 l-6 -6 l8 -1 z" opacity=".95"></path>
      </g>
      <g fill="#8fb4d6">
        <path d="M70 90 l3 8 l8 1 l-6 6 l2 8 l-7 -5 l-7 5 l2 -8 l-6 -6 l8 -1 z"></path>
      </g>
      <g stroke="#e26d6d" stroke-width="2" fill="none">
        <circle cx="130" cy="70" r="6"></circle>
        <circle cx="130" cy="70" r="10" opacity=".5"></circle>
      </g>
    </svg>
  </div>

  <!-- Title textbox -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:260px;top:230px;width:1400px;height:460px;z-index:10;text-align:center;">
    <div style="font-family:'Caveat',cursive;font-size:44px;color:#c47c86;letter-spacing:6px;transform:rotate(-1deg);">— class of ✿ twenty twenty-six —</div>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:190px;color:#5b4a52;line-height:1;margin-top:10px;letter-spacing:-2px;">Graduation</div>
    <div style="font-family:'Caveat',cursive;font-weight:700;font-size:130px;color:#d38a94;line-height:1;margin-top:2px;transform:rotate(-1.2deg);">memories album</div>
  </div>

  <!-- Polaroid 1 — big, tilted left -->
  <div data-object="true" data-object-type="image" style="position:absolute;left:150px;top:560px;width:340px;height:400px;z-index:8;background:#fffdf6;padding:18px 18px 70px;box-sizing:border-box;transform:rotate(-7deg);box-shadow:0 18px 30px rgba(90,60,60,.22);border:1px solid #ece1d2;">
    <div style="width:100%;height:298px;background:linear-gradient(135deg,#f7d0d4 0%,#f5b8c0 45%,#e29aa4 100%);position:relative;overflow:hidden;">
      <!-- little sun -->
      <div style="position:absolute;right:26px;top:26px;width:60px;height:60px;border-radius:50%;background:#fbe28a;box-shadow:0 0 0 8px rgba(251,226,138,.35);"></div>
      <!-- horizon hills -->
      <div style="position:absolute;bottom:0;left:0;width:100%;height:110px;background:#b8d4c6;border-radius:50% 50% 0 0 / 60% 60% 0 0;"></div>
      <div style="position:absolute;bottom:0;left:-30px;width:70%;height:80px;background:#9dc0af;border-radius:50% 50% 0 0 / 60% 60% 0 0;"></div>
    </div>
    <div style="font-family:'Caveat',cursive;font-size:34px;color:#5b4a52;text-align:center;margin-top:10px;">last day of school ♡</div>
    <!-- tape -->
    <div style="position:absolute;left:-24px;top:-14px;width:120px;height:36px;background:rgba(245,196,201,.75);transform:rotate(-24deg);"></div>
  </div>

  <!-- Polaroid 2 — mid, tilted right, offset -->
  <div data-object="true" data-object-type="image" style="position:absolute;left:1420px;top:610px;width:320px;height:380px;z-index:8;background:#fffdf6;padding:16px 16px 60px;box-sizing:border-box;transform:rotate(6deg);box-shadow:0 18px 30px rgba(90,60,60,.22);border:1px solid #ece1d2;">
    <div style="width:100%;height:282px;background:linear-gradient(135deg,#dbe8f3 0%,#b9d3ea 55%,#9cbfdc 100%);position:relative;overflow:hidden;">
      <!-- clouds -->
      <div style="position:absolute;left:30px;top:60px;width:120px;height:36px;background:#fffdf6;border-radius:20px;opacity:.85;"></div>
      <div style="position:absolute;left:50px;top:38px;width:70px;height:26px;background:#fffdf6;border-radius:16px;opacity:.8;"></div>
      <div style="position:absolute;right:24px;bottom:36px;width:90px;height:30px;background:#fffdf6;border-radius:16px;opacity:.8;"></div>
      <!-- paper plane -->
      <svg style="position:absolute;right:40px;top:26px" width="70" height="70" viewBox="0 0 70 70">
        <path d="M4 34 L64 8 L44 62 L34 40 Z" fill="#fffdf6" stroke="#5b4a52" stroke-width="1.5" stroke-linejoin="round"></path>
        <path d="M34 40 L64 8" stroke="#5b4a52" stroke-width="1.5" fill="none"></path>
      </svg>
    </div>
    <div style="font-family:'Caveat',cursive;font-size:32px;color:#5b4a52;text-align:center;margin-top:8px;">off we go ✈</div>
    <!-- tape -->
    <div style="position:absolute;right:-22px;top:-10px;width:110px;height:34px;background:rgba(159,196,224,.7);transform:rotate(22deg);"></div>
  </div>

  <!-- Ticket stub — bottom center -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:640px;top:830px;width:640px;height:150px;z-index:9;background:#fffdf6;transform:rotate(-2.2deg);box-shadow:0 12px 24px rgba(90,60,60,.18);border:1.5px dashed #d8b7a2;">
    <div style="position:absolute;left:0;top:0;bottom:0;width:180px;background:#f5c9cf;display:flex;align-items:center;justify-content:center;font-family:'Special Elite',monospace;color:#7a3f45;">
      <div style="text-align:center;line-height:1.1;">
        <div style="font-size:22px;letter-spacing:2px;">ADMIT ONE</div>
        <div style="font-size:56px;font-weight:700;">2026</div>
      </div>
    </div>
    <div style="position:absolute;left:180px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(0deg,#d8b7a2 0,#d8b7a2 6px,transparent 6px,transparent 12px);"></div>
    <div style="position:absolute;left:200px;top:20px;">
      <div style="font-family:'Special Elite',monospace;font-size:20px;color:#8a6b6f;letter-spacing:3px;">◇ MEMORY LANE ◇</div>
      <div style="font-family:'Caveat',cursive;font-size:44px;color:#5b4a52;line-height:1;margin-top:6px;">a ticket to remember</div>
      <div style="font-family:'Special Elite',monospace;font-size:16px;color:#8a6b6f;margin-top:8px;letter-spacing:2px;">SEAT: FRONT ROW  ·  ROW: A  ·  NO REFUNDS ON MEMORIES</div>
    </div>
  </div>

  <!-- Small handwritten note - bottom right -->
  <div data-object="true" data-object-type="textbox" style="position: absolute; left: 1570px; top: 1021px; width: 340px; height: 70px; z-index: 10; transform: rotate(-3deg) !important; font-family: &quot;Shadows Into Light&quot;, cursive; font-size: 28px; color: rgb(138, 107, 111); text-align: center; transform-origin: center center;">
    ✿ keep them close, always ✿
  </div>

  <!-- Little flower bottom-left -->
  <div data-object="true" data-object-type="icon" style="position:absolute;left:60px;top:945px;width:120px;height:120px;z-index:6;">
    <svg viewBox="0 0 120 120" width="120" height="120">
      <g transform="translate(60 60)">
        <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#f5c9cf"></ellipse>
        <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#f5c9cf" transform="rotate(72)"></ellipse>
        <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#f5c9cf" transform="rotate(144)"></ellipse>
        <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#f5c9cf" transform="rotate(216)"></ellipse>
        <ellipse cx="0" cy="-22" rx="14" ry="20" fill="#f5c9cf" transform="rotate(288)"></ellipse>
        <circle r="10" fill="#fbe28a"></circle>
      </g>
    </svg>
  </div>

  <!-- Page number chip -->
  <div data-object="true" data-object-type="textbox" data-screen-label="01 Cover" style="position:absolute;left:70px;top:60px;width:150px;height:52px;z-index:10;background:#fffdf6;border:1.5px solid #5b4a52;transform:rotate(-3deg);font-family:'Special Elite',monospace;font-size:22px;color:#5b4a52;text-align:center;line-height:52px;letter-spacing:3px;box-shadow:0 4px 8px rgba(90,60,60,.12);">
    ✧ 01 / 06
  </div>

</div>


</body></html>

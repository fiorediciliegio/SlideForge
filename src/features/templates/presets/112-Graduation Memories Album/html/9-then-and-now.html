<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then and Now</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=Playfair+Display:ital,wght@1,700&family=Special+Elite&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#faf3ea;}</style>
</head>
<body>
<div class="slide" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:
  radial-gradient(ellipse at 14% 16%, #dfeaf3 0%, transparent 50%),
  radial-gradient(ellipse at 86% 84%, #fce8ea 0%, transparent 50%),
  radial-gradient(ellipse at 50% 52%, #fbf1cf 0%, transparent 42%),
  #fbf5ec;">

  <!-- paper grain -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:.3;pointer-events:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22/></filter><rect width=%22200%22 height=%22200%22 filter=%22url(%23n)%22 opacity=%220.25%22/></svg>');"></div>
  <!-- grid dots -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;opacity:.14;background-image:radial-gradient(#c9a99a 1.2px, transparent 1.4px);background-size:40px 40px;"></div>

  <!-- Title -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:120px;top:96px;width:1340px;height:190px;z-index:10;">
    <div style="font-family:'Caveat',cursive;font-size:32px;color:#c47c86;letter-spacing:4px;">— chapter eight —</div>
    <div style="font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:78px;color:#5b4a52;line-height:1;margin-top:2px;">We Didn't Notice Ourselves Changing</div>
    <div style="font-family:'Kalam',cursive;font-size:24px;color:#8a6b6f;margin-top:6px;">the same six things, on day one and on the last day ✿</div>
  </div>

  <!-- star cluster -->
  <div data-object="true" data-object-type="icon" style="position:absolute;left:1680px;top:108px;width:140px;height:130px;z-index:6;">
    <svg viewBox="0 0 140 130" width="140" height="130">
      <path d="M34 18 l5 15 l15 2 l-11 10 l3 15 l-12 -8 l-12 8 l3 -15 l-11 -10 l15 -2 z" fill="#7fa3c4"/>
      <path d="M100 60 l5 16 l17 2 l-13 11 l4 17 l-13 -10 l-13 10 l4 -17 l-13 -11 l17 -2 z" fill="#e26d6d"/>
    </svg>
  </div>

  <!-- ============ COLUMN HEADERS ============ -->
  <!-- THEN header -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:640px;top:300px;width:300px;height:52px;z-index:10;background:#dbe8f3;border:2px solid #5b4a52;font-family:'Special Elite',monospace;font-size:16px;color:#3f5b7a;letter-spacing:5px;text-align:center;line-height:48px;transform:rotate(-1deg);box-shadow:0 4px 8px rgba(90,60,60,.14);">
    ◔ THEN · YEAR ONE
  </div>
  <!-- NOW header -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1290px;top:300px;width:300px;height:52px;z-index:10;background:#e26d6d;border:2px solid #5b4a52;font-family:'Special Elite',monospace;font-size:16px;color:#fffdf6;letter-spacing:5px;text-align:center;line-height:48px;transform:rotate(1deg);box-shadow:0 4px 8px rgba(90,60,60,.18);">
    ◕ NOW · YEAR FOUR
  </div>

  <!-- ============ COMPARISON SHEET ============ -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:370px;width:1720px;height:590px;z-index:4;background:#fffdf6;transform:rotate(-0.3deg);box-shadow:0 16px 30px rgba(90,60,60,.16);border:1px solid #ece1d2;"></div>
  <!-- corner tapes -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:84px;top:354px;width:140px;height:36px;z-index:9;background:repeating-linear-gradient(45deg,#f5c9cf 0 10px,#f7d9dd 10px 20px);opacity:.9;transform:rotate(-9deg);box-shadow:0 3px 6px rgba(0,0,0,.08);"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1700px;top:940px;width:140px;height:36px;z-index:9;background:repeating-linear-gradient(45deg,#dbe8f3 0 10px,#eaf1f7 10px 20px);opacity:.9;transform:rotate(-9deg);box-shadow:0 3px 6px rgba(0,0,0,.08);"></div>

  <!-- THE COMPARISON ROWS -->
  <div data-object="true" data-object-type="chart" style="position:absolute;left:130px;top:394px;width:1660px;height:544px;z-index:8;">
    <svg viewBox="0 0 1660 544" width="1660" height="544">
      <!-- vertical guide between THEN and NOW columns -->
      <line x1="1120" y1="18" x2="1120" y2="526" stroke="#e6d3c2" stroke-width="1.5" stroke-dasharray="4,6"/>

      <!-- ============ ROW 1 ============ -->
      <text x="0" y="30" font-family="'Special Elite',monospace" font-size="12" fill="#8a6b6f" letter-spacing="2">01 · THE CAMPUS MAP</text>
      <text x="0" y="64" font-family="'Caveat',cursive" font-size="30" font-weight="700" fill="#5b4a52">finding our way around</text>
      <!-- then -->
      <text x="530" y="58" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">phone out, map open, still lost</text>
      <!-- arrow -->
      <path d="M1060 50 L1096 50" stroke="#c47c86" stroke-width="2" fill="none"/>
      <path d="M1096 50 l-8 -5 l0 10 z" fill="#c47c86"/>
      <!-- now -->
      <text x="1150" y="58" font-family="'Kalam',cursive" font-size="19" fill="#5b4a52">could walk it with our eyes shut</text>
      <line x1="0" y1="84" x2="1660" y2="84" stroke="#f0e6d8" stroke-width="1.5"/>

      <!-- ============ ROW 2 ============ -->
      <text x="0" y="124" font-family="'Special Elite',monospace" font-size="12" fill="#8a6b6f" letter-spacing="2">02 · THE GROUP CHAT</text>
      <text x="0" y="158" font-family="'Caveat',cursive" font-size="30" font-weight="700" fill="#5b4a52">how we talked to each other</text>
      <text x="530" y="152" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">"hi! are you also in this class?"</text>
      <path d="M1060 144 L1096 144" stroke="#c47c86" stroke-width="2" fill="none"/>
      <path d="M1096 144 l-8 -5 l0 10 z" fill="#c47c86"/>
      <text x="1150" y="152" font-family="'Kalam',cursive" font-size="19" fill="#5b4a52">47 unread, none of them urgent ♡</text>
      <line x1="0" y1="178" x2="1660" y2="178" stroke="#f0e6d8" stroke-width="1.5"/>

      <!-- ============ ROW 3 ============ -->
      <text x="0" y="218" font-family="'Special Elite',monospace" font-size="12" fill="#8a6b6f" letter-spacing="2">03 · SUNDAY NIGHT</text>
      <text x="0" y="252" font-family="'Caveat',cursive" font-weight="700" font-size="30" fill="#5b4a52">what the week ahead felt like</text>
      <text x="530" y="246" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">a little homesick, a little scared</text>
      <path d="M1060 238 L1096 238" stroke="#c47c86" stroke-width="2" fill="none"/>
      <path d="M1096 238 l-8 -5 l0 10 z" fill="#c47c86"/>
      <text x="1150" y="246" font-family="'Kalam',cursive" font-size="19" fill="#5b4a52">this <tspan font-style="italic">is</tspan> home now — that's the problem</text>
      <line x1="0" y1="272" x2="1660" y2="272" stroke="#f0e6d8" stroke-width="1.5"/>

      <!-- ============ ROW 4 ============ -->
      <text x="0" y="312" font-family="'Special Elite',monospace" font-size="12" fill="#8a6b6f" letter-spacing="2">04 · GROUP PROJECTS</text>
      <text x="0" y="346" font-family="'Caveat',cursive" font-size="30" font-weight="700" fill="#5b4a52">working with other people</text>
      <text x="530" y="340" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">did everything alone, just in case</text>
      <path d="M1060 332 L1096 332" stroke="#c47c86" stroke-width="2" fill="none"/>
      <path d="M1096 332 l-8 -5 l0 10 z" fill="#c47c86"/>
      <text x="1150" y="340" font-family="'Kalam',cursive" font-size="19" fill="#5b4a52">learned who to trust with the hard part</text>
      <line x1="0" y1="366" x2="1660" y2="366" stroke="#f0e6d8" stroke-width="1.5"/>

      <!-- ============ ROW 5 ============ -->
      <text x="0" y="406" font-family="'Special Elite',monospace" font-size="12" fill="#8a6b6f" letter-spacing="2">05 · GETTING IT WRONG</text>
      <text x="0" y="440" font-family="'Caveat',cursive" font-size="30" font-weight="700" fill="#5b4a52">how we handled a bad grade</text>
      <text x="530" y="434" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">felt like the end of the world</text>
      <path d="M1060 426 L1096 426" stroke="#c47c86" stroke-width="2" fill="none"/>
      <path d="M1096 426 l-8 -5 l0 10 z" fill="#c47c86"/>
      <text x="1150" y="434" font-family="'Kalam',cursive" font-size="19" fill="#5b4a52">felt like Tuesday — and we kept going</text>
      <line x1="0" y1="460" x2="1660" y2="460" stroke="#f0e6d8" stroke-width="1.5"/>

      <!-- ============ ROW 6 — THE RED ONE ============ -->
      <rect x="-14" y="476" width="1688" height="62" rx="6" fill="#fce8ea" opacity=".75"/>
      <text x="0" y="502" font-family="'Special Elite',monospace" font-size="12" fill="#7a3f45" letter-spacing="2">06 · GOODBYES</text>
      <text x="0" y="532" font-family="'Caveat',cursive" font-size="32" font-weight="700" fill="#e26d6d">saying see-you-later</text>
      <text x="530" y="526" font-family="'Kalam',cursive" font-size="19" fill="#8a6b6f">easy — everything was still ahead</text>
      <path d="M1060 518 L1096 518" stroke="#e26d6d" stroke-width="2.5" fill="none"/>
      <path d="M1096 518 l-9 -6 l0 12 z" fill="#e26d6d"/>
      <text x="1150" y="526" font-family="'Kalam',cursive" font-size="19" font-weight="700" fill="#e26d6d">the hardest thing we've had to do ♡</text>
    </svg>
  </div>

  <!-- ============ BOTTOM: the closing insight ============ -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:980px;width:1720px;height:76px;z-index:5;background:#fffdf6;transform:rotate(-0.4deg);box-shadow:0 10px 20px rgba(90,60,60,.14);border:1px solid #d8c9b8;border-left:10px solid #e26d6d;"></div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:140px;top:996px;width:1650px;height:52px;z-index:10;transform:rotate(-0.4deg);">
    <span style="font-family:'Special Elite',monospace;font-size:12px;color:#7a3f45;letter-spacing:2px;">THE PATTERN&nbsp;&nbsp;·&nbsp;&nbsp;</span>
    <span style="font-family:'Caveat',cursive;font-weight:700;font-size:34px;color:#5b4a52;">nothing changed on any single day — which is exactly how four years works ✿</span>
  </div>

  <!-- page chip -->
  <div data-object="true" data-object-type="textbox" data-screen-label="09 Then and Now" style="position:absolute;left:70px;top:60px;width:150px;height:52px;z-index:10;background:#fffdf6;border:1.5px solid #5b4a52;transform:rotate(-3deg);font-family:'Special Elite',monospace;font-size:22px;color:#5b4a52;text-align:center;line-height:52px;letter-spacing:3px;box-shadow:0 4px 8px rgba(90,60,60,.12);">
    ✧ 09 / 10
  </div>

</div>
</body>
</html>

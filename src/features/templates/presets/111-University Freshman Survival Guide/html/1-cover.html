<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cover — Freshman Survival Guide</title>
<style>
/* Sticker-collage theme — Freshman Survival Guide */
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Nunito:wght@600;700;800;900&family=Patrick+Hand&display=swap');

:root{
  --blue:#2C7BE5;        /* bright blue */
  --blue-deep:#1B4FA6;
  --orange:#FF7A2A;      /* bright orange */
  --orange-soft:#FFB877;
  --lime:#B8E438;        /* lime green */
  --lime-deep:#7BB800;
  --purple:#8B5CF6;      /* small purple accent */
  --purple-deep:#5B21B6;
  --white:#FFFFFF;
  --cream:#FFF8E9;       /* soft warm off-white bg — not beige-luxury */
  --paper:#FDFBF3;
  --ink:#1F2A44;         /* deep navy ink for handwriting feel */
  --ink-soft:#3B4A6B;

  --f-display:'Fredoka', system-ui, sans-serif;
  --f-hand:'Caveat', cursive;
  --f-marker:'Patrick Hand', cursive;
  --f-body:'Nunito', system-ui, sans-serif;
}

/* --- Sticker & tape utility styles (used inline in slides) --- */
.sticker{
  background:#fff;
  border-radius:18px;
  box-shadow:0 6px 0 rgba(31,42,68,.12), 0 14px 30px rgba(31,42,68,.10);
  border:3px solid var(--ink);
}
.tape{
  position:absolute;
  background:rgba(255, 224, 130, .78);
  box-shadow:0 4px 10px rgba(0,0,0,.10);
  transform:rotate(-6deg);
}
.pin{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff6b6b, #b91c1c 70%);
  box-shadow:0 4px 0 rgba(0,0,0,.25), inset -3px -4px 6px rgba(0,0,0,.25);
  border:3px solid #fff;
}
</style>
<style>
  body{margin:0;padding:0;overflow:hidden;font-family:var(--f-body);}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;
    background:
      radial-gradient(circle at 12% 18%, rgba(184,228,56,.35), transparent 32%),
      radial-gradient(circle at 88% 82%, rgba(255,122,42,.28), transparent 34%),
      radial-gradient(circle at 78% 15%, rgba(139,92,246,.22), transparent 28%),
      #FFF8E9;
  }
  /* dotted grid — playful notebook feel */
  .dots{position:absolute;inset:0;
    background-image: radial-gradient(rgba(31,42,68,.13) 2px, transparent 2px);
    background-size: 44px 44px;
    background-position: 22px 22px;
    z-index:0;
  }
</style>
</head>
<body>
<div class="slide" data-screen-label="01 Cover">
  <div class="dots" data-object="true" data-object-type="shape" style="position:absolute;left:0;top:0;width:1920px;height:1080px;"></div>

  <!-- Big blue title panel, slight tilt -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:180px;width:1220px;height:580px;
              background:var(--blue);border:6px solid var(--ink);border-radius:36px;
              transform:rotate(-2.2deg);
              box-shadow:14px 14px 0 var(--ink);z-index:1;">
  </div>

  <!-- Title textbox on top of panel -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:130px;top:210px;width:1160px;height:520px;
              transform:rotate(-2.2deg);z-index:10;color:#fff;">
    <div style="font-family:var(--f-hand);font-size:64px;color:var(--lime);line-height:1;transform:rotate(-3deg);display:inline-block;">hey, freshman!</div>
    <div style="font-family:var(--f-body);font-weight:900;font-size:132px;line-height:1;margin-top:10px;letter-spacing:-1px;">
      FRESHMAN<br>
      <span style="color:var(--lime);">SURVIVAL</span> <span style="color:#FFE082;">GUIDE</span>
    </div>
    <div style="font-family:var(--f-marker);font-size:36px;color:#FFF;margin-top:18px;">
      Everything you wish someone told you before Day&nbsp;1 ✦
    </div>
  </div>

  <!-- Orange coffee-cup sticker -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1360px;top:180px;width:290px;height:290px;
              background:var(--orange);border:5px solid var(--ink);border-radius:50%;
              transform:rotate(9deg);
              box-shadow:8px 8px 0 var(--ink);z-index:2;">
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1360px;top:180px;width:290px;height:290px;
              transform:rotate(9deg);z-index:11;
              display:flex;align-items:center;justify-content:center;
              font-family:var(--f-display);font-weight:700;font-size:110px;color:#fff;line-height:1;">
    ☕
  </div>

  <!-- Lime notebook sticker -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1420px;top:520px;width:340px;height:240px;
              background:var(--lime);border:5px solid var(--ink);border-radius:22px;
              transform:rotate(-8deg);
              box-shadow:8px 8px 0 var(--ink);z-index:2;">
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1420px;top:520px;width:340px;height:240px;
              transform:rotate(-8deg);z-index:11;
              display:flex;flex-direction:column;align-items:center;justify-content:center;
              color:var(--ink);text-align:center;">
    <div style="font-family:var(--f-display);font-size:80px;line-height:1;">📚</div>
    <div style="font-family:var(--f-hand);font-size:44px;line-height:1;margin-top:4px;">study smart</div>
  </div>

  <!-- Small purple star sticker -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:1300px;top:800px;width:150px;height:150px;
              background:var(--purple);border:5px solid var(--ink);border-radius:26px;
              transform:rotate(14deg);
              box-shadow:6px 6px 0 var(--ink);z-index:2;">
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1300px;top:800px;width:150px;height:150px;
              transform:rotate(14deg);z-index:11;
              display:flex;align-items:center;justify-content:center;
              font-size:80px;">
    ⭐
  </div>

  <!-- Washi tape strip in corner -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:40px;top:80px;width:240px;height:48px;
              background:repeating-linear-gradient(90deg, var(--orange) 0 22px, #FFD9B8 22px 44px);
              transform:rotate(-14deg);opacity:.9;z-index:3;
              box-shadow:0 4px 10px rgba(0,0,0,.10);">
  </div>

  <!-- Handwritten arrow + note pointing to bottom-info card -->
  <svg data-object="true" data-object-type="shape" style="position:absolute;left:970px;top:800px;width:180px;height:150px;z-index:12;" viewBox="0 0 180 150" fill="none">
    <path d="M 20 20 C 60 40, 90 80, 130 120" stroke="#5B21B6" stroke-width="6" stroke-linecap="round" fill="none"></path>
    <path d="M 118 100 L 132 122 L 108 128" stroke="#5B21B6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
  </svg>
  <div data-object="true" data-object-type="textbox" style="position: absolute; left: 1001.1px; top: 780px; width: 220px; height: 60px; font-family: var(--f-hand); font-size: 40px; color: var(--purple-deep); transform: rotate(-6deg) !important; z-index: 12; text-align: right; transform-origin: center center;">
    read this ↴
  </div>

  <!-- Bottom info card -->
  <div data-object="true" data-object-type="shape" style="position:absolute;left:100px;top:840px;width:820px;height:190px;
              background:#fff;border:5px solid var(--ink);border-radius:22px;
              box-shadow:8px 8px 0 var(--ink);z-index:2;">
  </div>
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:130px;top:860px;width:760px;height:150px;z-index:11;">
    <div style="font-family:var(--f-display);font-weight:700;font-size:42px;color:var(--ink);line-height:1;">
      6 slides · 1 mission
    </div>
    <div style="font-family:var(--f-body);font-weight:600;font-size:24px;color:var(--ink-soft);margin-top:12px;line-height:1.35;">
      Campus map → Classes → Dorm life → Money hacks → First-week checklist.<br>
      Stick around, take notes, tag your best friend.
    </div>
  </div>

  <!-- Page number sticker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute;left:1780px;top:990px;width:80px;height:60px;
              font-family:var(--f-hand);font-size:40px;color:var(--ink-soft);z-index:10;">
    01
  </div>
</div>


</body></html>
